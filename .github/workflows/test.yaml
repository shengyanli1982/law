on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
name: Test
jobs:
    test:
        strategy:
            matrix:
                go-version: [1.23.x, 1.24.x, 1.25.x]
                os: [ubuntu-latest, macos-15, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/setup-go@v5
              with:
                  go-version: "${{ matrix.go-version }}"
            - uses: actions/checkout@v4
            - name: Test
              run: go test -v -race ./...
            - name: Verify nested modules
              run: |
                  go -C benchmark vet ./...
                  go -C benchmark build ./...
                  go -C examples/http/server/asyncwriter vet ./...
                  go -C examples/http/server/asyncwriter build ./...
                  go -C examples/http/server/syncwriter vet ./...
                  go -C examples/http/server/syncwriter build ./...
                  go -C examples/log/klog vet ./...
                  go -C examples/log/klog build ./...
                  go -C examples/log/logrus vet ./...
                  go -C examples/log/logrus build ./...
                  go -C examples/log/zap vet ./...
                  go -C examples/log/zap build ./...
                  go -C examples/log/zerolog vet ./...
                  go -C examples/log/zerolog build ./...
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.24.x"
            - name: golangci-lint
              uses: golangci/golangci-lint-action@v6
              with:
                  version: latest
                  args: --timeout=5m
